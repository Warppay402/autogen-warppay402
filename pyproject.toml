[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autogen-warppay402"
version = "1.1.0"
description = "Microsoft AutoGen tool integration for WarpPay402 x402 monetized APIs and autonomous agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "WarpPay402", email = "warppay.402@gmail.com" }]
dependencies = [
    "warppay402-mcp>=1.3.0",
]

[project.urls]
Homepage = "https://www.warppay402.com"
Repository = "https://github.com/Warppay402/autogen-warppay402"
Documentation = "https://api.warppay402.com/openapi.json"
